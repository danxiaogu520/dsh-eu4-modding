name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        node: ['22', '24']
        manager: [npm, pnpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        if: matrix.manager == 'pnpm'
        with:
          version: 10.18.0
      - run: npm ci
        if: matrix.manager == 'npm'
      - run: pnpm install --frozen-lockfile --config.node-linker=isolated
        if: matrix.manager == 'pnpm'
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - run: npm run check:package
      - run: npm run docs:agents
      - run: git diff --exit-code -- AGENTS.md examples/AGENTS.md
  windows:
    # The suite spawns language-server fixtures and locks their working directories, which behaves
    # differently on Windows; keep a native Windows job so that platform cannot regress unnoticed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:package
  integration:
    # Exercise the released server the plugin actually downloads. ParadoxCode 0.5.3 is the oldest
    # supported release, so the job asserts the requirement instead of testing older servers.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Real server integration (downloaded, SHA-256 verified)
        env:
          PARADOXCODE_TEST_SERVER: auto
          PARADOXCODE_TEST_VERSION: 0.5.3
          PARADOXCODE_TEST_CACHE: ${{ runner.temp }}/pdc-cache
        run: npm run test:integration
